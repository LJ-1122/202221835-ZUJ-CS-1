<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A warm welcome to our website.">
  <title>Welcome</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f8fafc;
      background:
        radial-gradient(circle at 15% 20%, rgba(56, 189, 248, .18), transparent 32%),
        radial-gradient(circle at 85% 80%, rgba(129, 140, 248, .20), transparent 35%),
        #0b1220;
    }

    main {
      width: min(100%, 720px);
      padding: clamp(32px, 7vw, 64px);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 28px;
      background: rgba(15, 23, 42, .78);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
      backdrop-filter: blur(14px);
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 20px;
      padding: 8px 14px;
      border: 1px solid rgba(125, 211, 252, .3);
      border-radius: 999px;
      color: #bae6fd;
      background: rgba(14, 165, 233, .10);
      font-size: .85rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      line-height: 1.05;
      letter-spacing: -.055em;
    }

    h1 span { color: #7dd3fc; }

    p {
      max-width: 500px;
      margin: 22px auto 30px;
      color: #cbd5e1;
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      line-height: 1.7;
    }

    a {
      display: inline-block;
      padding: 13px 22px;
      border-radius: 12px;
      color: #082f49;
      background: #7dd3fc;
      font-weight: 700;
      text-decoration: none;
      transition: transform .2s ease, background .2s ease;
    }

    a:hover { transform: translateY(-2px); background: #bae6fd; }
    a:focus-visible { outline: 3px solid white; outline-offset: 4px; }

    footer {
      margin-top: 34px;
      color: #64748b;
      font-size: .85rem;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">A new beginning</div>
    <h1>Welcome <span>to our website.</span></h1>
    <p>
      We're glad you're here. Explore, discover, and make yourself at home.
      Something great starts with a warm welcome.
    </p>
    <a href="#welcome">Get Started</a>
    <footer id="welcome">Thanks for visiting.</footer>
  </main>
</body>
</html>
